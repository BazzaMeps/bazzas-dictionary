<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bazza’s Flag Oracle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏳️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#16203A; --muted:#5A6479; --line:#D3DAE3;
  --accent:#C8102E; --good:#1E7A4C; --bad:#B3261E; --pole:#9AA4B2; --finial:#C9A227;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1424; --surface:#18213A; --ink:#E7ECF4; --muted:#9AA6BC; --line:#2A3552;
    --accent:#E8455C; --good:#4CC38A; --bad:#FF7A70; --pole:#5A667E; --finial:#D8B23A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif}
button{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* Header */
header.top{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand h1{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.01em}
.brand a{color:var(--muted);font-size:.85rem;text-decoration:none;white-space:nowrap}
.brand a:hover{color:var(--ink)}
.tabs{display:flex;gap:4px;padding-bottom:12px}
.tab{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 2px;border-radius:999px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

section.view{padding:8px 0 40px}
section.view[hidden]{display:none}

/* Buttons */
.btn{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Today */
.daybar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 0 22px}
.date{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:1.05rem;color:var(--muted);margin:0}
.daybar .row .btn{padding:8px 14px;font-size:.9rem}
.hero{display:flex;align-items:stretch;padding-bottom:70px;margin-bottom:6px}
.pole{position:relative;flex:0 0 8px;border-radius:4px;margin-top:4px;
  background:linear-gradient(90deg,var(--pole),color-mix(in srgb,var(--pole) 55%,#fff),var(--pole))}
.pole::before{content:"";position:absolute;top:-14px;left:50%;width:18px;height:18px;border-radius:50%;transform:translateX(-50%);
  background:radial-gradient(circle at 35% 35%,#fff6,transparent 50%),var(--finial)}
.cloth{position:relative;width:min(100% - 8px,520px);align-self:flex-start;margin-top:6px}
.cloth.squarish{width:min(100% - 8px,360px)}
.cloth img{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px rgba(22,32,58,.25))}
.shine{position:absolute;inset:0;overflow:hidden;pointer-events:none;mix-blend-mode:soft-light;
  -webkit-mask:var(--flag) 0 0/100% 100% no-repeat;mask:var(--flag) 0 0/100% 100% no-repeat}
.bands{position:absolute;top:0;bottom:0;left:-240px;right:-240px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0,rgba(255,255,255,.32) 70px,rgba(255,255,255,0) 140px,rgba(0,0,0,.22) 240px);
  animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(240px)}}
@media (prefers-reduced-motion:reduce){.bands{animation:none}}

/* Card */
.name{margin:0;font-size:clamp(2.1rem,8vw,3.4rem);font-weight:800;line-height:1.02;letter-spacing:-.02em}
.sub{margin:8px 0 16px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.sw{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 5px;font-size:.88rem}
.sw i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.facts{display:grid;gap:12px;margin:0 0 16px}
.facts div{display:grid;grid-template-columns:8.5rem 1fr;gap:10px;align-items:start}
.facts dt{color:var(--muted);font-size:.92rem}
.facts dd{margin:0}
.note{margin:0 0 6px;padding:14px 16px;background:var(--surface);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;max-width:62ch}
.twins{display:flex;flex-wrap:wrap;gap:10px}
.mini{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 10px 5px 5px;cursor:pointer;color:var(--ink)}
.mini img{width:36px;height:24px;object-fit:contain}

/* Explore */
.count{margin:22px 0 2px;font:800 clamp(2.6rem,10vw,3.8rem)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.countsub{margin:0 0 6px;color:var(--muted)}
.fgroup h3{font-size:1.02rem;margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:6px 12px;font-size:.85rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 10px;margin:26px 0}
.panel h3{margin:0 0 4px;font-size:1.1rem}
.panel p.lead{margin:0 0 12px;color:var(--muted);font-size:.93rem}
.bar{display:grid;grid-template-columns:7.2rem 1fr 2.6rem;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;padding:5px 0;cursor:pointer;text-align:left}
.bar .lbl{display:flex;align-items:center;gap:7px;font-size:.92rem}
.bar .lbl i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.track{height:12px;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--ink)}
.num{text-align:right;font-variant-numeric:tabular-nums;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px;margin-top:14px}
.tile{background:none;border:0;padding:0;text-align:left;color:var(--ink);cursor:pointer}
.tile img{width:100%;aspect-ratio:3/2;object-fit:contain;object-position:left center;display:block;filter:drop-shadow(0 0 .6px rgba(0,0,0,.55))}
.tile span{display:block;font-size:.82rem;margin-top:5px;line-height:1.25}
.empty{padding:30px 0;color:var(--muted)}

/* Quiz */
.qintro{margin:22px 0 4px}
.qintro h2{margin:0 0 4px;font-size:1.6rem;font-weight:800}
.qintro p{margin:0;color:var(--muted)}
.qbar{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 12px;color:var(--muted);font-size:.95rem}
.qbar strong{color:var(--ink);font-size:1.1rem}
.prompt{font:800 clamp(1.5rem,6vw,2.2rem)/1.1 "Bricolage Grotesque",sans-serif;margin:0 0 14px}
.qflag{width:min(100%,420px);margin-bottom:16px}
.qflag img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(22,32,58,.22))}
.closeup{width:min(100%,420px);aspect-ratio:3/2;background-repeat:no-repeat;background-color:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;transition:background-size .35s ease,background-position .35s ease}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.opt{padding:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;line-height:1.25}
.opt img{width:100%;aspect-ratio:3/2;object-fit:contain;display:block}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.opt:disabled{cursor:default}
.feedback{margin:16px 0 12px}
.feedback .verdict{font-weight:700}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.result{margin:26px 0}
.result .big{font:800 clamp(3rem,14vw,4.6rem)/1 "Bricolage Grotesque",sans-serif;margin:0}

/* Dialog */
dialog#sheet{border:0;border-radius:18px;padding:0;width:calc(100% - 24px);max-width:560px;max-height:calc(100% - 40px);background:var(--bg);color:var(--ink)}
dialog#sheet::backdrop{background:rgba(10,15,30,.55)}
.sheetin{padding:20px 20px 24px}
.sheetin .flagbig{width:100%;max-width:400px;height:auto;display:block;margin:6px 0 18px;filter:drop-shadow(0 6px 14px rgba(22,32,58,.25))}
.closex{float:right;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}

/* Finder */
.lead{color:var(--muted);margin:0}
.toprow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.results{display:grid;gap:10px;margin-top:10px}
.rrow{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;color:var(--ink);cursor:pointer}
.rrow img{width:88px;aspect-ratio:3/2;object-fit:contain;filter:drop-shadow(0 0 .6px rgba(0,0,0,.55))}
.rrow .rn{font-weight:600;line-height:1.25}
.rrow .why{font-size:.84rem;color:var(--muted);margin-top:3px;line-height:1.35}
.rrow .pc{font:800 1.3rem/1 "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.sechead{font-size:1.15rem;margin:30px 0 4px}

/* Flagle */
.clues{display:grid;gap:8px;margin:18px 0}
.clue{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.clue .ct{display:block;font-size:.84rem;color:var(--muted)}
.clue .swatches{margin:6px 0 2px}
.clue.locked{color:var(--muted);border-style:dashed;background:transparent;font-size:.9rem}
.blur{width:min(100%,300px);overflow:hidden;border-radius:6px;margin-top:6px}
.blur img{width:100%;display:block;filter:blur(12px);transform:scale(1.15)}
.guessbox input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:500 1rem "Public Sans",system-ui,sans-serif}
.guessbox input:focus{outline:none;border-color:var(--ink)}
.sugs{display:grid;gap:4px;margin-top:6px}
.sug{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--ink);cursor:pointer;text-align:left}
.sug img{width:36px;height:24px;object-fit:contain;flex:none}
.guesses{display:grid;gap:8px;margin:14px 0}
.grow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.grow .gn{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem}
.grow .gn img{width:36px;height:24px;object-fit:contain;flex:none}
.grow .gn .gi{margin-left:auto;color:var(--muted);font-weight:400;font-size:.84rem}
.tags{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}
.tag{font-size:.74rem;padding:5px 4px;border-radius:6px;text-align:center;line-height:1.15}
.tag.g{background:var(--good);color:#fff}
.tag.y{background:#E0A800;color:#16203A}
.tag.b{background:color-mix(in srgb,var(--line) 80%,transparent);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px;text-align:center}
.stats b{display:block;font:800 1.7rem/1.1 "Bricolage Grotesque",sans-serif}
.stats span{font-size:.8rem;color:var(--muted)}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;padding:18px 0 30px}
footer p{margin:0 0 6px;max-width:62ch}
@media (max-width:480px){
  .facts div{grid-template-columns:1fr;gap:2px}
  .bar{grid-template-columns:6.2rem 1fr 2.4rem}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Bazza’s Flag Oracle</h1>
      <a href="https://bazzameps.github.io/">Bazza Ecosystem</a>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button class="tab" role="tab" data-tab="flagle" aria-selected="false">Flagle</button>
      <button class="tab" role="tab" data-tab="finder" aria-selected="false">Finder</button>
      <button class="tab" role="tab" data-tab="explore" aria-selected="false">Explore</button>
      <button class="tab" role="tab" data-tab="quiz" aria-selected="false">Quiz</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-today"></section>
  <section class="view" id="view-flagle" hidden></section>
  <section class="view" id="view-finder" hidden></section>
  <section class="view" id="view-explore" hidden></section>
  <section class="view" id="view-quiz" hidden></section>
</main>

<footer class="wrap">
  <p>Bazza’s Flag Oracle v2. Flag images from flagcdn.com. Colours count the main design, not every speck inside a coat of arms.</p>
  <p>Vexillology, not vexatiousness. No flags were shagged in the making of this app.</p>
</footer>

<dialog id="sheet"><div class="sheetin" id="sheetin"></div></dialog>

<script>

*/

const FLAGS = RAW.trim().split('\n').map(line => {
  const [code,name,capital,cont,cols,layout,feats,note] = line.split('|');
  return {code,name,capital,cont,cols:[...cols],layout,feats:[...(feats||'')],note:(note||'').trim()};
});
const BY = Object.fromEntries(FLAGS.map(f => [f.code,f]));
const N = FLAGS.length;

const COL = {R:['Red','#CE1126'],W:['White','#FFFFFF'],B:['Blue','#1F4FA3'],Y:['Yellow or gold','#F2C200'],G:['Green','#138A43'],K:['Black','#121212'],O:['Orange','#F08A1C']};
const CORDER = ['R','W','B','Y','G','K','O'];
const LAYOUTS = {h:'Horizontal stripes',v:'Vertical stripes',k:'Box in the top corner',n:'Nordic cross',c:'Centred cross',x:'Diagonal or saltire',t:'Triangle at the pole side',p:'Plain field with an emblem',q:'Blocks of colour',o:'Something else entirely'};
const FEATS = {s:'Star',S:'Sun',m:'Moon or crescent',a:'Animal',l:'Plant or tree',w:'Weapon',e:'Coat of arms or emblem',x:'Writing',M:'Map',u:'Union Jack',c:'Cross'};
const CONTS = {Af:'Africa',As:'Asia',Eu:'Europe',NA:'North America',SA:'South America',Oc:'Oceania'};
const TWINS = [['td','ro','ad','md'],['id','mc','pl'],['ie','ci','it'],['it','mx'],['nl','lu'],['au','nz'],['sn','ml','gn','cm'],['co','ec','ve'],['ru','si','sk','rs'],['ne','in'],['jo','ps','sd','kw'],['us','lr','my'],['hn','ni','sv'],['qa','bh'],['at','lv'],['eg','ye','iq','sy'],['tr','tn'],['no','is'],['gb-eng','ge']];

const svgUrl = c => `https://flagcdn.com/${c}.svg`;
const pngUrl = (c,w=160) => `https://flagcdn.com/w${w}/${c}.png`;
const hasFeat = (f,k) => f.feats.includes(k) || (k==='c' && (f.layout==='n'||f.layout==='c'));
const twinsOf = c => [...new Set(TWINS.filter(g=>g.includes(c)).flat())].filter(x=>x!==c);
const featList = f => Object.keys(FEATS).filter(k=>hasFeat(f,k)).map(k=>FEATS[k]);
const $ = s => document.querySelector(s);

/* Storage (best scores, last tab) */
const store = {
  get(k,d){try{const v=localStorage.getItem('bfo.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('bfo.'+k,JSON.stringify(v))}catch(e){}}
};

/* Random helpers */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ---------- Shared card ---------- */
function swatchesHTML(f){
  return `<div class="swatches">${f.cols.map(c=>`<span class="sw"><i style="background:${COL[c][1]}"></i>${COL[c][0]}</span>`).join('')}</div>`;
}
function factsHTML(f){
  const feats = featList(f);
  const tw = twinsOf(f.code);
  return `
  <h2 class="name">${f.name}</h2>
  <p class="sub">Capital: ${f.capital}. ${CONTS[f.cont]}.</p>
  ${swatchesHTML(f)}
  <dl class="facts">
    <div><dt>Layout</dt><dd>${LAYOUTS[f.layout]}</dd></div>
    <div><dt>Features</dt><dd>${feats.length?feats.join(', '):'None, just colours'}</dd></div>
    ${tw.length?`<div><dt>Easily confused with</dt><dd><div class="twins">${tw.map(c=>`<button class="mini" data-open="${c}"><img src="${pngUrl(c,80)}" alt="" loading="lazy">${BY[c].name}</button>`).join('')}</div></dd></div>`:''}
  </dl>
  ${f.note?`<p class="note">${f.note}</p>`:''}`;
}

/* ---------- Detail sheet ---------- */
const sheet = $('#sheet');
function openSheet(code){
  const f = BY[code]; if(!f) return;
  $('#sheetin').innerHTML = `<button class="closex" data-close>Close</button>
    <img class="flagbig" src="${svgUrl(f.code)}" alt="Flag of ${f.name}">${factsHTML(f)}`;
  if(!sheet.open) sheet.showModal();
  $('#sheetin').scrollTop = 0; sheet.scrollTop = 0;
}
sheet.addEventListener('click', e => { if(e.target===sheet) sheet.close(); });
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if(o){ openSheet(o.dataset.open); return; }
  if(e.target.closest('[data-close]')) sheet.close();
  const g = e.target.closest('[data-goto]'); if(g) showTab(g.dataset.goto);
});

/* ---------- Tabs ---------- */
function showTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t));
  ['today','flagle','finder','explore','quiz'].forEach(v=>$('#view-'+v).hidden = v!==t);
  if(t==='flagle' && dayNum()!==FL.dn){ flagleLoad(); renderFlagle(); }
  store.set('tab',t);
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));

/* ---------- Today ---------- */
const ORDER = shuffle(FLAGS.map((_,i)=>i), mulberry32(1973));
let dayOffset = 0;
const dayNum = (d=new Date()) => Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const fotdFor = dn => FLAGS[ORDER[((dn%N)+N)%N]];
function flagForOffset(off){
  const d = new Date(); d.setDate(d.getDate()+off);
  const dn = Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
  return {date:d, f:FLAGS[ORDER[((dn%N)+N)%N]]};
}
function renderToday(){
  const {date,f} = flagForOffset(dayOffset);
  const label = date.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const v = $('#view-today');
  v.innerHTML = `
    <div class="daybar">
      <p class="date">${dayOffset===0?'Flag of the day, ':''}${label}</p>
      <div class="row">
        <button class="btn ghost" id="prevDay" aria-label="Previous day">Earlier</button>
        <button class="btn ghost" id="nextDay" ${dayOffset===0?'disabled':''} aria-label="Next day">Later</button>
      </div>
    </div>
    <div class="hero">
      <div class="pole" aria-hidden="true"></div>
      <div class="cloth" id="cloth" style="--flag:url('${svgUrl(f.code)}')">
        <img src="${svgUrl(f.code)}" alt="Flag of ${f.name}" id="heroImg">
        <span class="shine" aria-hidden="true"><span class="bands"></span></span>
      </div>
    </div>
    ${factsHTML(f)}
    <div class="row" style="margin-top:22px">
      ${dayOffset!==0?'<button class="btn" id="backToday">Back to today</button>':''}
      <button class="btn ${dayOffset!==0?'ghost':''}" id="randomFlag">Show me a random flag</button>
      <button class="btn ghost" data-goto="flagle">Play today’s Flagle</button>
    </div>`;
  const img = $('#heroImg');
  const fit = () => { if(img.naturalWidth && img.naturalHeight && img.naturalWidth/img.naturalHeight < 1.25) $('#cloth').classList.add('squarish'); };
  img.complete ? fit() : img.addEventListener('load',fit);
  $('#prevDay').onclick = () => { dayOffset--; renderToday(); };
  $('#nextDay').onclick = () => { if(dayOffset<0){ dayOffset++; renderToday(); } };
  const bt = $('#backToday'); if(bt) bt.onclick = () => { dayOffset=0; renderToday(); };
  $('#randomFlag').onclick = () => openSheet(pick(FLAGS).code);
}

/* ---------- Explore ---------- */
const F = {cols:new Set(), colMode:'all', ncol:null, layout:null, feats:new Set(), cont:null};
function matches(f){
  if(F.cont && f.cont!==F.cont) return false;
  if(F.layout && f.layout!==F.layout) return false;
  for(const k of F.feats) if(!hasFeat(f,k)) return false;
  if(F.ncol!==null){ if(F.ncol===6 ? f.cols.length<6 : f.cols.length!==F.ncol) return false; }
  if(F.cols.size){
    if(F.colMode==='all'){ for(const c of F.cols) if(!f.cols.includes(c)) return false; }
    else { if(!f.cols.every(c=>F.cols.has(c))) return false; }
  }
  return true;
}
function chip(label,pressed,data,sw){
  return `<button class="chip" aria-pressed="${pressed}" ${data}>${sw?`<i style="background:${sw}"></i>`:''}${label}</button>`;
}
function renderExplore(){
  const list = FLAGS.filter(matches).sort((a,b)=>a.name.localeCompare(b.name));
  const n = list.length;
  const anyFilter = F.cols.size||F.ncol!==null||F.layout||F.feats.size||F.cont;

  // Colour league over current results
  const colCounts = CORDER.map(c=>[c, list.filter(f=>f.cols.includes(c)).length]).sort((a,b)=>b[1]-a[1]);
  const top = colCounts[0];
  const nCounts = [1,2,3,4,5,6].map(k=>[k, list.filter(f=>k===6?f.cols.length>=6:f.cols.length===k).length]);
  const pct = x => n ? Math.round(x/n*100) : 0;

  $('#view-explore').innerHTML = `
    <p class="count">${n}</p>
    <p class="countsub">${n===1?'flag matches':'flags match'}${anyFilter?'':` (the full set: 193 UN members, plus Vatican City, Palestine, Kosovo, Taiwan, England, Scotland and Wales)`}.</p>
    ${anyFilter?`<button class="btn ghost" id="resetF" style="margin-top:8px">Clear all filters</button>`:''}

    <div class="fgroup"><h3>Colours</h3>
      <div class="chips">${CORDER.map(c=>chip(COL[c][0],F.cols.has(c),`data-col="${c}"`,COL[c][1])).join('')}</div>
      <div class="seg" role="group" aria-label="Colour matching">
        <button data-cmode="all" aria-pressed="${F.colMode==='all'}">Uses all of these</button>
        <button data-cmode="only" aria-pressed="${F.colMode==='only'}">Uses only these</button>
      </div>
    </div>
    <div class="fgroup"><h3>Number of colours</h3>
      <div class="chips">${[1,2,3,4,5,6].map(k=>chip(k===6?'6 or more':String(k),F.ncol===k,`data-ncol="${k}"`)).join('')}</div>
    </div>
    <div class="fgroup"><h3>Layout</h3>
      <div class="chips">${Object.entries(LAYOUTS).map(([k,v])=>chip(v,F.layout===k,`data-layout="${k}"`)).join('')}</div>
    </div>
    <div class="fgroup"><h3>Has a</h3>
      <div class="chips">${Object.entries(FEATS).map(([k,v])=>chip(v,F.feats.has(k),`data-feat="${k}"`)).join('')}</div>
    </div>
    <div class="fgroup"><h3>Continent</h3>
      <div class="chips">${Object.entries(CONTS).map(([k,v])=>chip(v,F.cont===k,`data-cont="${k}"`)).join('')}</div>
    </div>

    ${n?`
    <div class="panel">
      <h3>Colour league</h3>
      <p class="lead">${COL[top[0]][0]} is the most common colour here, on ${top[1]} of ${n} flags (${pct(top[1])}%). Tap a bar to filter by it.</p>
      ${colCounts.map(([c,k])=>`<button class="bar" data-solo="${c}"><span class="lbl"><i style="background:${COL[c][1]}"></i>${COL[c][0]}</span><span class="track"><span class="fill" style="width:${pct(k)}%;background:${c==='W'?'var(--muted)':COL[c][1]}"></span></span><span class="num">${k}</span></button>`).join('')}

/* ---------- Quiz ---------- */
const MODES = {
  name:{label:'Name the flag',blurb:'See a flag, pick the country.'},
  spot:{label:'Spot the flag',blurb:'See a country, pick its flag.'},
  closeup:{label:'Close-up',blurb:'A zoomed-in corner. Guess straight away for 3 points, or zoom out for fewer.'},
  twins:{label:'Evil twins',blurb:'Only the lookalikes. Chad or Romania? Good luck.'}
};
const Q = {mode:store.get('qmode','name'), cont:store.get('qcont','all'), total:10, i:0, score:0, cur:null, opts:[], done:false, chosen:null, zoom:0, pos:[50,50], used:new Set(), phase:'setup'};
const ZOOMS = [450,250,0]; // 0 = whole flag
const POSITIONS = [[0,0],[50,0],[100,0],[0,50],[50,50],[100,50],[0,100],[50,100],[100,100]];
const bestKey = () => `best.${Q.mode}.${Q.mode==='twins'?'all':Q.cont}`;
const maxScore = () => Q.total*(Q.mode==='closeup'?3:1);

function similar(ans,pool,n,exclude){
  const ex = new Set([ans.code,...exclude]);
  return pool.filter(f=>!ex.has(f.code))
    .map(f=>({f,s:f.cols.filter(c=>ans.cols.includes(c)).length - Math.abs(f.cols.length-ans.cols.length)*.5 + (f.layout===ans.layout?1.2:0) + Math.random()*1.8}))
    .sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.f);
}
function quizPool(){ return FLAGS.filter(f=>Q.cont==='all'||f.cont===Q.cont); }

function startRound(){ Q.i=0; Q.score=0; Q.used=new Set(); Q.phase='play'; nextQ(); }
function nextQ(){
  if(Q.i>=Q.total){ endRound(); return; }
  Q.i++; Q.done=false; Q.chosen=null; Q.zoom=0; Q.pos=pick(POSITIONS);
  if(Q.mode==='twins'){
    const g = pick(TWINS);
    Q.cur = BY[pick(g)];
    let opts = g.map(c=>BY[c]);
    if(opts.length<4) opts = opts.concat(similar(Q.cur,FLAGS,4-opts.length,g));
    Q.opts = shuffle(opts);
  } else {
    const pool = quizPool();
    let fresh = pool.filter(f=>!Q.used.has(f.code));
    if(!fresh.length) fresh = pool;
    Q.cur = pick(fresh); Q.used.add(Q.cur.code);
    Q.opts = shuffle([Q.cur, ...similar(Q.cur,pool,3,[])]);
  }
  renderQuiz();
}
function answer(code){
  if(Q.done) return;
  Q.done = true; Q.chosen = code;
  if(code===Q.cur.code) Q.score += Q.mode==='closeup' ? [3,2,1][Q.zoom] : 1;
  renderQuiz();
}
function endRound(){
  Q.phase='end';
  const prev = store.get(bestKey(),null);
  Q.newBest = prev===null || Q.score>prev;
  if(Q.newBest) store.set(bestKey(),Q.score);
  renderQuiz();
}

function setupHTML(){
  const best = store.get(bestKey(),null);
  return `
    <div class="qintro"><h2>Quiz</h2><p>Rounds of ${Q.total}. Your best score for each mode is saved on this device.</p></div>
    <div class="fgroup"><h3>Mode</h3>

      <p style="margin:10px 0 0;color:var(--muted)">${MODES[Q.mode].blurb}</p>
    </div>
    ${Q.mode!=='twins'?`<div class="fgroup"><h3>Flags from</h3>
      <div class="chips">${chip('Everywhere',Q.cont==='all','data-qcont="all"')}${Object.entries(CONTS).map(([k,v])=>chip(v,Q.cont===k,`data-qcont="${k}"`)).join('')}</div>
    </div>`:''}
    <div class="row" style="margin-top:24px">
      <button class="btn" data-qstart>Start a round</button>
      ${best!==null?`<span style="color:var(--muted)">Best: ${best} out of ${maxScore()}</span>`:''}
    </div>`;
}
function playHTML(){
  const f = Q.cur, done = Q.done;
  const cls = o => !done ? '' : o.code===f.code ? 'good' : o.code===Q.chosen ? 'bad' : '';
  let stage = '', opts = '';
  if(Q.mode==='spot'){
    stage = `<p class="prompt">Which is the flag of ${f.name}?</p>`;
    opts = Q.opts.map((o,i)=>`<button class="opt ${cls(o)}" data-ans="${o.code}" ${done?'disabled':''} aria-label="Option ${i+1}${done?', '+o.name:''}"><img src="${pngUrl(o.code,320)}" alt=""></button>`).join('');
  } else {
    if(Q.mode==='closeup'){
      const z = done ? 0 : ZOOMS[Q.zoom];
      const bg = z ? `background-size:${z}% auto;background-position:${Q.pos[0]}% ${Q.pos[1]}%` : 'background-size:contain;background-position:center';
      stage = `<p class="prompt">Whose flag is this?</p>
        <div class="closeup" role="img" aria-label="Zoomed-in mystery flag" style="background-image:url('${svgUrl(f.code)}');${bg}"></div>
        ${!done && Q.zoom<2?`<button class="btn ghost" data-zoom style="margin-bottom:10px">Zoom out (worth ${[2,1][Q.zoom]} ${Q.zoom===1?'point':'points'})</button>`:''}`;
    } else {
      stage = `<p class="prompt">${Q.mode==='twins'?'Which twin is this?':'Whose flag is this?'}</p>
        <div class="qflag"><img src="${svgUrl(f.code)}" alt="Mystery flag"></div>`;
    }
    opts = Q.opts.map(o=>`<button class="opt ${cls(o)}" data-ans="${o.code}" ${done?'disabled':''}>${o.name}</button>`).join('');
  }
  let fb = '';
  if(done){
    const right = Q.chosen===f.code;
    const tw = twinsOf(f.code).map(c=>BY[c].name);
    fb = `<div class="feedback">
      <p class="verdict ${right?'good':'bad'}">${right?'Correct.':'Not quite.'} That’s ${f.name}.</p>
      ${tw.length?`<p style="margin:4px 0 0;color:var(--muted)">Easily confused with ${tw.join(', ')}.</p>`:''}
      <div class="row" style="margin-top:12px">
        <button class="btn" data-qnext>${Q.i>=Q.total?'See my score':'Next flag'}</button>
        <button class="btn ghost" data-open="${f.code}">About this flag</button>
      </div></div>`;
  }
  return `<div class="qbar"><span>Question ${Q.i} of ${Q.total}</span><span>Score <strong>${Q.score}</strong></span></div>
    ${stage}<div class="opts">${opts}</div>${fb}
    <button class="btn ghost" data-qquit style="margin-top:22px">Stop this round</button>`;
}
function endHTML(){
  const best = store.get(bestKey(),Q.score);
  return `<div class="result">
    <p style="margin:0 0 6px;color:var(--muted)">${MODES[Q.mode].label}${Q.mode!=='twins'&&Q.cont!=='all'?', '+CONTS[Q.cont]:''}</p>
    <p class="big">${Q.score} / ${maxScore()}</p>
    <p>${Q.newBest?'New personal best.':`Your best is ${best}.`}</p>
    <div class="row" style="margin-top:16px">
      <button class="btn" data-qstart>Play again</button>
      <button class="btn ghost" data-qsetup>Change mode</button>
    </div></div>`;
}
function renderQuiz(){
  $('#view-quiz').innerHTML = Q.phase==='setup' ? setupHTML() : Q.phase==='play' ? playHTML() : endHTML();
}
$('#view-quiz').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.qmode){ Q.mode=d.qmode; store.set('qmode',Q.mode); renderQuiz(); }

/* ---------- Flag Finder ---------- */
const FD = {cols:new Set(), layout:null, feats:new Set(), cont:null};
function finderScore(f){
  let s=0, max=0; const hits=[], misses=[];
  for(const c of FD.cols){ max+=3; if(f.cols.includes(c)){ s+=3; hits.push(COL[c][0].toLowerCase()); } else { s-=3; misses.push(COL[c][0].toLowerCase()); } }
  if(FD.cols.size) s -= f.cols.filter(c=>!FD.cols.has(c)).length*0.75;
  if(FD.layout){ max+=4; const l=LAYOUTS[FD.layout].toLowerCase(); if(f.layout===FD.layout){ s+=4; hits.push(l); } else { s-=1; misses.push(l); } }
  for(const k of FD.feats){ max+=3; const l=FEATS[k].toLowerCase(); if(hasFeat(f,k)){ s+=3; hits.push(l); } else { s-=2.5; misses.push(l); } }
  if(FD.cont){ max+=1.5; if(f.cont===FD.cont) s+=1.5; }
  return {f, s, pct: max ? Math.max(0,Math.min(100,Math.round(s/max*100))) : 0, hits, misses};
}
function renderFinder(){
  const any = FD.cols.size||FD.layout||FD.feats.size||FD.cont;
  const res = any ? FLAGS.map(finderScore).filter(r=>r.pct>0).sort((a,b)=>b.s-a.s||a.f.name.localeCompare(b.f.name)).slice(0,10) : [];
  $('#view-finder').innerHTML = `
    <div class="qintro"><h2>Flag Finder</h2>
      <p>Saw a flag and can’t place it? Tap whatever you remember. It doesn’t need to be perfect: the closest matches rise to the top.</p></div>
    ${any?`<div class="toprow">${res.slice(0,3).map(r=>`<button class="mini" data-open="${r.f.code}"><img src="${pngUrl(r.f.code,80)}" alt="">${r.f.name}, ${r.pct}%</button>`).join('')||'<span class="lead">No close matches yet. Try removing something you’re unsure of.</span>'}</div>
      <button class="btn ghost" data-fd-reset>Start again</button>`:''}
    <div class="fgroup"><h3>Colours you remember</h3>
      <div class="chips">${CORDER.map(c=>chip(COL[c][0],FD.cols.has(c),`data-fcol="${c}"`,COL[c][1])).join('')}</div></div>
    <div class="fgroup"><h3>The design</h3>
      <div class="chips">${Object.entries(LAYOUTS).map(([k,v])=>chip(v,FD.layout===k,`data-flayout="${k}"`)).join('')}</div></div>
    <div class="fgroup"><h3>Did it have a…</h3>
      <div class="chips">${Object.entries(FEATS).map(([k,v])=>chip(v,FD.feats.has(k),`data-ffeat="${k}"`)).join('')}</div></div>
    <div class="fgroup"><h3>Probably from</h3>
      <div class="chips">${Object.entries(CONTS).map(([k,v])=>chip(v,FD.cont===k,`data-fcont="${k}"`)).join('')}</div></div>
    ${any?`<h3 class="sechead">Best matches</h3>
      ${res.length?`<div class="results">${res.map(r=>`<button class="rrow" data-open="${r.f.code}">
        <img src="${pngUrl(r.f.code)}" srcset="${pngUrl(r.f.code,320)} 2x" alt="" loading="lazy">
        <span><span class="rn">${r.f.name}</span>
          <span class="why">${r.hits.length?'Matches: '+r.hits.join(', ')+'.':''}${r.misses.length?` Doesn’t match: ${r.misses.join(', ')}.`:''}</span></span>
        <span class="pc">${r.pct}%</span></button>`).join('')}</div>`
      :`<p class="empty">Nothing matches that combination. Try removing something you’re unsure of.</p>`}`:''}`;
}

/* ---------- Daily Flagle ---------- */
const LAUNCH = Date.UTC(2026,10,8)/864e5;
const FORDER = shuffle(FLAGS.map((_,i)=>i), mulberry32(4242));
function flagleAnswer(dn){
  let i = ((dn%N)+N)%N, f = FLAGS[FORDER[i]];
  if(f.code===fotdFor(dn).code) f = FLAGS[FORDER[(i+1)%N]];
  return f;
}
const FL = {dn:null, ans:null, guesses:[], done:false, won:false, msg:''};
function flagleLoad(){
  FL.dn = dayNum(); FL.ans = flagleAnswer(FL.dn); FL.msg='';
  const s = store.get('flagle.today',null);
  if(s && s.day===FL.dn){ FL.guesses=s.guesses; FL.done=s.done; FL.won=s.won; }
  else { FL.guesses=[]; FL.done=false; FL.won=false; }
}
const flagleSave = () => store.set('flagle.today',{day:FL.dn,guesses:FL.guesses,done:FL.done,won:FL.won});
const STATS0 = {played:0,wins:0,streak:0,max:0,dist:[0,0,0,0,0,0],last:null,lastWin:null};
function recordStats(){
  const st = Object.assign({},STATS0,store.get('flagle.stats',{}));
  if(st.last===FL.dn) return;
  st.played++; st.last=FL.dn;
  if(FL.won){ st.wins++; st.dist[FL.guesses.length-1]++; st.streak = st.lastWin===FL.dn-1 ? st.streak+1 : 1; st.lastWin=FL.dn; st.max=Math.max(st.max,st.streak); }
  else st.streak = 0;
  store.set('flagle.stats',st);
}
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’'`.]/g,'').replace(/-/g,' ').replace(/\s+/g,' ').trim();
const ALIASES = {'turkey':'tr','uk':'gb','great britain':'gb','britain':'gb','usa':'us','us':'us','america':'us','united states of america':'us','ivory coast':'ci','czech republic':'cz','swaziland':'sz','burma':'mm','east timor':'tl','holland':'nl','drc':'cd','congo':'cg','democratic republic of the congo':'cd','korea':'kr','macedonia':'mk','vatican':'va','holy see':'va','cape verde':'cv','uae':'ae','emirates':'ae','bahamas':'bs','st kitts':'kn','st lucia':'lc','st vincent':'vc','png':'pg','bosnia':'ba'};
const NAMEIDX = FLAGS.map(f=>[norm(f.name),f.code]).concat(Object.entries(ALIASES));
function suggestions(q){
  q = norm(q); if(!q) return [];
  const seen = new Set(), starts=[], contains=[];
  for(const [n,c] of NAMEIDX){
    if(seen.has(c) || FL.guesses.includes(c)) continue;
    if(n.startsWith(q) || n.split(' ').some(w=>w.startsWith(q))){ starts.push(c); seen.add(c); }
    else if(n.includes(q)){ contains.push(c); seen.add(c); }
  }
  return starts.concat(contains).slice(0,6).map(c=>BY[c]);
}
function compare(g,a){
  const gc=new Set(g.cols), ac=new Set(a.cols), shared=a.cols.filter(c=>gc.has(c)).length;
  const gf=Object.keys(FEATS).filter(k=>hasFeat(g,k)), af=Object.keys(FEATS).filter(k=>hasFeat(a,k)), fs=af.filter(k=>gf.includes(k)).length;
  return {
    cont: g.cont===a.cont ? 'g':'b',
    cols: (shared===ac.size && gc.size===ac.size) ? 'g' : shared ? 'y':'b',
    layout: g.layout===a.layout ? 'g':'b',
    feats: (gf.length===af.length && fs===af.length) ? 'g' : fs ? 'y':'b'
  };
}
const TAGTXT = {cont:['Continent','Same continent','Other continent'],cols:['Colours','Same colours','Some colours','No shared colours'],layout:['Layout','Same layout','Other layout'],feats:['Features','Same features','Some features','No shared features']};
function tagHTML(k,v){

    : `<div class="guessbox">
        <label for="flInput" style="display:block;font-weight:600;margin-bottom:6px">Guess ${FL.guesses.length+1} of 6 (${left} left)</label>
        <input id="flInput" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Start typing a country">
        <div class="sugs" id="flSugs"></div>
      </div>`}`;
  const inp = $('#flInput');
  if(inp){
    const draw = () => { $('#flSugs').innerHTML = suggestions(inp.value).map(f=>`<button class="sug" data-fl-guess="${f.code}"><img src="${pngUrl(f.code,80)}" alt="">${f.name}</button>`).join(''); };
    inp.addEventListener('input', draw);
    inp.addEventListener('keydown', e => { if(e.key==='Enter'){ const s=suggestions(inp.value); if(s.length) flagleGuess(s[0].code); } });
  }
}
function flagleGuess(code){
  if(FL.done || FL.guesses.includes(code)) return;
  FL.guesses.push(code);
  if(code===FL.ans.code){ FL.done=true; FL.won=true; } else if(FL.guesses.length>=6) FL.done=true;
  flagleSave(); if(FL.done) recordStats();
  renderFlagle();
  const inp=$('#flInput'); if(inp) inp.focus({preventScroll:true});
}
$('#view-flagle').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.flGuess) flagleGuess(b.dataset.flGuess);
  else if('flShare' in b.dataset) shareFlagle();
});

/* ---------- Boot ---------- */
flagleLoad();
renderFlagle();
renderFinder();
renderToday();
renderExplore();
renderQuiz();
showTab(store.get('tab','today'));
</script>
</body>
</html>
