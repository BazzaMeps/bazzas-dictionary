<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bazza's Dictionary</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='12' fill='%23fbfaf5' stroke='%231c2e5a' stroke-width='6'/><text x='50' y='70' font-size='58' font-family='Arial' font-weight='700' text-anchor='middle' fill='%231c2e5a'>B</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --board:#1c2e5a; --board-2:#24396d;
  --tile:#fbfaf5; --tile-edge:#cfc8b2; --tile-ink:#1c2e5a;
  --clock:#f2c230;
  --bg:#e8edf6; --surface:#ffffff; --ink:#1a1f2b; --muted:#5d6779; --line:#cdd5e4;
  --good:#2f7d4f; --bad:#b3362c;
  --ui:"Bricolage Grotesque", "Segoe UI", Roboto, system-ui, sans-serif;
  --read:"Literata", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1830; --surface:#17223f; --ink:#e9edf6; --muted:#9aa6c0; --line:#2b3a62;
    --board:#24396d; --board-2:#2d4580; --good:#5cc489; --bad:#ef7b70;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1830; --surface:#17223f; --ink:#e9edf6; --muted:#9aa6c0; --line:#2b3a62;
  --board:#24396d; --board-2:#2d4580; --good:#5cc489; --bad:#ef7b70;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--clock);outline-offset:2px}

/* Header: the board */
header{background:var(--board);color:#fff;padding:18px 16px 0}
.wrap{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:.01em;opacity:.85}
.title-tiles{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 16px}

.tile{display:inline-grid;place-items:center;width:2.1em;height:2.1em;background:var(--tile);color:var(--tile-ink);
  border-radius:4px;box-shadow:inset 0 -3px 0 var(--tile-edge);font-weight:800;font-size:1.15rem;text-transform:uppercase;line-height:1}
.title-tiles .tile{font-size:1.35rem}
.tile.blank{background:transparent;color:var(--clock);box-shadow:inset 0 0 0 2px var(--clock)}
.tile.empty{background:var(--board-2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}

nav{display:flex;gap:2px}
nav button{flex:1;background:transparent;border:0;color:#c9d3ea;padding:12px 6px 14px;font-weight:600;cursor:pointer;border-radius:8px 8px 0 0}
nav button[aria-selected="true"]{background:var(--bg);color:var(--ink)}

main{padding:20px 16px 48px}
section[hidden]{display:none}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{flex:1 1 200px;min-width:0;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-size:1.1rem}
.field:focus{border-color:var(--board-2);outline:none}
.btn{padding:12px 18px;border-radius:10px;border:0;background:var(--board);color:#fff;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn:not(.ghost){background:var(--clock);color:#1c2e5a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){background:var(--clock);color:#1c2e5a}}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.35;filter:grayscale(1);cursor:not-allowed}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
.status{color:var(--muted);margin:16px 0}
.status.err{color:var(--bad)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.95rem}
.chip.rare{color:var(--muted);background:transparent}
.chip mark{background:transparent;color:inherit;text-decoration:underline wavy var(--clock) 2px;text-underline-offset:3px}

/* Define */
.entry{margin-top:20px}
.headword{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.headword h2{margin:0;font-size:2.4rem;font-weight:800;line-height:1.05;word-break:break-word}
.phon{font-family:var(--read);color:var(--muted);font-size:1.1rem}
.audio{border:2px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;cursor:pointer;font-size:1rem}
.pos{margin:24px 0 6px;font-family:var(--read);font-style:italic;font-size:1.15rem;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
ol.defs{margin:0;padding-left:1.6em;font-family:var(--read);line-height:1.6;max-width:65ch}
ol.defs li{margin:10px 0}
ol.defs .ex{display:block;color:var(--muted);font-style:italic}
.nyms{margin:10px 0 0;font-size:.9rem;color:var(--muted)}
.nyms .chips{margin-top:6px}
.source{margin-top:28px;font-size:.85rem;color:var(--muted)}
.source a{color:inherit}
.inlist{font-size:.9rem;color:var(--muted);margin-top:6px}
.recent{margin-top:24px}
.recent h3,.opts h3{font-size:.95rem;font-weight:600;color:var(--muted);margin:0 0 8px}

/* Unscramble */
.preview{display:flex;gap:4px;flex-wrap:wrap;min-height:2.6em;margin:14px 0 4px}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:.95rem}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts select{padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--surface)}
.group{margin-top:22px}
.group h3{margin:0 0 8px;font-size:1.05rem;font-weight:800}
.group h3 span{font-weight:400;color:var(--muted)}
.more{margin-top:8px}

/* Countdown */
.cd-board{background:var(--board);border-radius:14px;padding:16px;color:#fff}
.cd-tiles{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.cd-tiles .tile{width:100%;height:auto;aspect-ratio:1;font-size:clamp(1rem,5vw,1.6rem)}
.clock{height:10px;background:var(--board-2);border-radius:999px;margin:16px 0 4px;overflow:hidden}
.clock div{height:100%;width:0;background:var(--clock);transition:width .25s linear}
.cd-meta{display:flex;justify-content:space-between;font-size:.9rem;color:#c9d3ea}
.cd-controls{margin-top:14px}
.cd-controls .btn{flex:1}
.verdict{margin-top:12px;font-weight:600}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}

@media (prefers-reduced-motion: reduce){.clock div{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><h1>Bazza's Dictionary</h1></div>
    <div class="title-tiles" aria-hidden="true">
      <span class="tile">w</span><span class="tile">o</span><span class="tile">r</span><span class="tile">d</span><span class="tile">s</span>
    </div>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-tab="define">Define</button>
      <button role="tab" aria-selected="false" data-tab="unscramble">Unscramble</button>
      <button role="tab" aria-selected="false" data-tab="countdown">Countdown</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- DEFINE -->
  <section id="tab-define">
    <form class="row" id="defineForm" autocomplete="off" onsubmit="return false">
      <input class="field" id="defineInput" type="search" placeholder="Type a word" autocapitalize="none" spellcheck="false" enterkeyhint="search">
      <button class="btn" id="defineBtn">Look up</button>
    </form>
    <div id="defineOut"></div>
    <div class="recent" id="recentWrap" hidden>
      <h3>Recent</h3>
      <div class="chips" id="recentChips"></div>
    </div>
  </section>

  <!-- UNSCRAMBLE -->
  <section id="tab-unscramble" hidden>
    <form class="row" id="unForm" autocomplete="off" onsubmit="return false">
      <input class="field" id="unInput" type="text" placeholder="Letters, ? for a blank" autocapitalize="none" spellcheck="false" maxlength="15" enterkeyhint="go">
      <button class="btn" id="unBtn">Unscramble</button>
    </form>
    <div class="preview" id="unPreview" aria-hidden="true"></div>
    <p class="hint">Up to 15 letters. Use ? for a blank tile (up to 3). Letters filled by a blank get a yellow underline.</p>
    <div class="opts">
      <label>Shortest word
        <select id="minLen"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
      </label>
      <label><input type="checkbox" id="commonOnly"> Common words only</label>
    </div>
    <div id="unOut"></div>
  </section>

  <!-- COUNTDOWN -->
  <section id="tab-countdown" hidden>
    <div class="cd-board">
      <div class="cd-tiles" id="cdTiles"></div>
      <div class="clock" aria-hidden="true"><div id="cdBar"></div></div>
      <div class="cd-meta"><span id="cdCounts">Pick 9 letters: at least 3 vowels and 4 consonants</span><span id="cdTime"></span></div>
    </div>
    <div class="row cd-controls">
      <button class="btn" id="vowelBtn">Vowel</button>
      <button class="btn" id="consBtn">Consonant</button>
    </div>
    <div class="row cd-controls">
      <button class="btn ghost" id="randomBtn">Random 9</button>
      <button class="btn ghost" id="newBtn">New round</button>
    </div>
    <div id="cdPlay" hidden>
      <form class="row" style="margin-top:18px" id="cdForm" autocomplete="off" onsubmit="return false">
        <input class="field" id="cdInput" type="text" placeholder="Your word" autocapitalize="none" spellcheck="false" enterkeyhint="done">
        <button class="btn" id="cdCheck">Check</button>
      </form>
      <div class="verdict" id="cdVerdict" role="status"></div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" id="revealBtn">Show best words</button></div>
      <div id="cdOut"></div>
    </div>
  </section>
</main>

<script>
(() => {
"use strict";

const WORDS_URL  = "https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt";
const COMMON_URL = "https://raw.githubusercontent.com/first20hours/google-10000-english/master/google-10000-english.txt";
const DICT_URL   = "https://api.dictionaryapi.dev/api/v2/entries/en/";
const CACHE_NAME = "bazza-dict-lists-v1";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- storage (never fatal) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- word lists ---------- */
let WORDS = null, WORDSET = null, RANK = null, listsPromise = null;

async function getText(url){
  // Cache the 4 MB list on the phone so it only downloads once.
  if ("caches" in window) {
    try {
      const cache = await caches.open(CACHE_NAME);
      const hit = await cache.match(url);
      if (hit) return await hit.text();
      const res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      try { await cache.put(url, res.clone()); } catch {}
      return await res.text();
    } catch (e) { /* fall through to a plain fetch */ }
  }
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.text();
}

function loadLists(){
  if (!listsPromise) {
    listsPromise = Promise.all([getText(WORDS_URL), getText(COMMON_URL)]).then(([all, common]) => {
      WORDS = all.split(/\r?\n/).map(w => w.trim().toLowerCase()).filter(w => /^[a-z]+$/.test(w));
      WORDSET = new Set(WORDS);
      RANK = new Map();
      common.split(/\r?\n/).forEach((w, i) => { w = w.trim().toLowerCase(); if (w && !RANK.has(w)) RANK.set(w, i); });
    }).catch(e => { listsPromise = null; throw e; });
  }
  return listsPromise;
}

/* Find every word buildable from the letters (+ blanks).
   Returns [{w, blanks:[positions filled by a blank], rank}] */
function solve(letters, blanks, minLen){
  const avail = new Int8Array(26);
  for (const ch of letters) avail[ch.charCodeAt(0) - 97]++;
  const total = letters.length + blanks;
  const need = new Int8Array(26);
  const out = [];
  for (let k = 0; k < WORDS.length; k++) {
    const w = WORDS[k], L = w.length;
    if (L < minLen || L > total) continue;
    need.set(avail);
    let b = blanks, ok = true, pos = null;
    for (let i = 0; i < L; i++) {
      const c = w.charCodeAt(i) - 97;
      if (need[c] > 0) need[c]--;
      else if (b > 0) { b--; (pos || (pos = [])).push(i); }
      else { ok = false; break; }
    }
    if (ok) out.push({ w, blanks: pos || [], rank: RANK.has(w) ? RANK.get(w) : Infinity });
  }
  out.sort((a, b) => b.w.length - a.w.length || a.rank - b.rank || (a.w < b.w ? -1 : 1));
  return out;
}

function wordChip(r){
  let html = "";
  for (let i = 0; i < r.w.length; i++) html += r.blanks.includes(i) ? `<mark>${r.w[i]}</mark>` : r.w[i];
  const rare = r.rank === Infinity ? " rare" : "";
  return `<button class="chip${rare}" data-word="${r.w}" title="${rare ? "Uncommon word" : "Common word"}">${html}</button>`;
}

function renderGroups(target, results, total, opts = {}){
  const cap = opts.cap || 60;
  if (!results.length) { target.innerHTML = `<p class="status">No words found. Try more letters, a blank (?), or a shorter minimum length.</p>`; return; }
  const groups = new Map();
  for (const r of results) { if (!groups.has(r.w.length)) groups.set(r.w.length, []); groups.get(r.w.length).push(r); }
  let html = `<p class="status">${results.length.toLocaleString("en-GB")} words. Bold ones are common; faded ones are obscure. Tap any word for its definition.</p>`;
  let g = 0;
  for (const [len, list] of groups) {
    if (opts.maxGroups && g++ >= opts.maxGroups) break;
    const label = len === total ? `${len} letters, uses them all` : `${len} letters`;
    const shown = list.slice(0, cap);
    html += `<div class="group"><h3>${label} <span>(${list.length})</span></h3><div class="chips">${shown.map(wordChip).join("")}</div>`;
    if (list.length > cap) html += `<button class="btn ghost more" data-more="${len}">Show all ${list.length}</button>`;
    html += `</div>`;
  }
  target.innerHTML = html;
  target.querySelectorAll("[data-more]").forEach(btn => btn.addEventListener("click", () => {
    const list = groups.get(+btn.dataset.more);
    btn.previousElementSibling.innerHTML = list.map(wordChip).join("");
    btn.remove();
  }));
}

/* ---------- tabs ---------- */
function showTab(name){
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  ["define","unscramble","countdown"].forEach(t => $("tab-" + t).hidden = t !== name);
  store.set("bd-tab", name);
  if (name !== "define") loadLists().catch(() => {}); // warm up the word list in the background
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

// Any word chip anywhere opens its definition
document.addEventListener("click", e => {
  const chip = e.target.closest("[data-word]");
  if (!chip) return;
  showTab("define");
  $("defineInput").value = chip.dataset.word;
  define(chip.dataset.word);
  window.scrollTo({ top: 0 });
});

/* ---------- DEFINE ---------- */
let recent = store.get("bd-recent", []);
function renderRecent(){
  $("recentWrap").hidden = !recent.length;
  $("recentChips").innerHTML = recent.map(w => `<button class="chip" data-word="${esc(w)}">${esc(w)}</button>`).join("");
}
function addRecent(w){
  recent = [w, ...recent.filter(x => x !== w)].slice(0, 20);
  store.set("bd-recent", recent); renderRecent();
}

let defineSeq = 0;
const WIKT_URL = "https://en.wiktionary.org/api/rest_v1/page/definition/";
const stripHTML = html => { const t = document.createElement("template"); t.innerHTML = html || ""; return t.content.textContent.trim(); };

async function fetchJSON(url, ms = 7000){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    let data = null;
    try { data = await res.json(); } catch {}
    return { status: res.status, ok: res.ok, data };
  } finally { clearTimeout(timer); }
}

/* Source 1: Free Dictionary API. Returns entry, null (no such word) or throws (service problem). */
async function fromFreeDict(word){
  const { status, ok, data } = await fetchJSON(DICT_URL + encodeURIComponent(word));
  if (status === 404) return null;
  if (!ok || !Array.isArray(data)) throw new Error("Free Dictionary API returned " + status);
  const phon = data.map(d => d.phonetic).find(Boolean) || (data.flatMap(d => d.phonetics || []).find(p => p.text) || {}).text || "";
  const audios = data.flatMap(d => d.phonetics || []).map(p => p.audio).filter(Boolean);
  const byPos = new Map();
  for (const entry of data) for (const m of entry.meanings || []) {
    const key = m.partOfSpeech || "other";
    if (!byPos.has(key)) byPos.set(key, { defs: [], syn: new Set(), ant: new Set() });
    const slot = byPos.get(key);
    (m.definitions || []).forEach(d => {
      slot.defs.push({ text: d.definition, ex: d.example });
      (d.synonyms || []).forEach(s => slot.syn.add(s));
      (d.antonyms || []).forEach(s => slot.ant.add(s));
    });
    (m.synonyms || []).forEach(s => slot.syn.add(s));
    (m.antonyms || []).forEach(s => slot.ant.add(s));
  }
  return {
    word: data[0].word || word, phon,
    audio: audios.find(a => /-uk\.mp3$/.test(a)) || audios[0] || "",
    byPos, sources: [...new Set(data.flatMap(d => d.sourceUrls || []))],
    credit: "Definitions from Wiktionary (CC BY-SA) via Free Dictionary API"
  };
}

/* Source 2: Wiktionary directly. Backup when source 1 is down, and covers far more obscure words. */
async function fromWiktionary(word){
  const { status, ok, data } = await fetchJSON(WIKT_URL + encodeURIComponent(word));
  if (status === 404) return null;
  if (!ok || !data) throw new Error("Wiktionary returned " + status);
  const en = data.en || [];
  const byPos = new Map();
  for (const sec of en) {
    const key = (sec.partOfSpeech || "other").toLowerCase();
    if (!byPos.has(key)) byPos.set(key, { defs: [], syn: new Set(), ant: new Set() });
    for (const d of sec.definitions || []) {
      const text = stripHTML(d.definition);
      if (!text) continue;
      const ex = (d.parsedExamples && d.parsedExamples[0] && stripHTML(d.parsedExamples[0].example))
              || (d.examples && stripHTML(d.examples[0])) || "";
      byPos.get(key).defs.push({ text, ex });
    }
  }
  for (const [k, v] of byPos) if (!v.defs.length) byPos.delete(k);
  if (!byPos.size) return null;
  return { word, phon: "", audio: "", byPos,
    sources: ["https://en.wiktionary.org/wiki/" + encodeURIComponent(word)],
    credit: "Definitions from Wiktionary (CC BY-SA)" };
}

async function define(raw){
  const word = raw.trim().toLowerCase();
  if (!word) return;
  const seq = ++defineSeq;
  const out = $("defineOut");
  out.innerHTML = `<p class="status">Looking up “${esc(word)}”…</p>`;

  let entry = null, failures = 0;
  for (const source of [fromFreeDict, fromWiktionary]) {
    try { entry = await source(word); if (entry) break; }
    catch (e) { failures++; console.warn(e); }
  }
  if (seq !== defineSeq) return;

  const listNote = WORDSET ? `<div class="inlist">${WORDSET.has(word) ? "Valid in the anagram word list." : "Not in the anagram word list."}</div>` : "";
  if (!entry) {
    out.innerHTML = failures === 2
      ? `<p class="status err">Couldn't reach either dictionary. Check your connection and try again.</p>`
      : `<div class="entry"><div class="headword"><h2>${esc(word)}</h2></div>${listNote}
         <p class="status">No definition found for “${esc(word)}”. Try the base form (singular, or without -ed / -ing).</p></div>`;
    return;
  }
  addRecent(word);

  const nymChips = set => [...set].slice(0, 16).map(s => `<button class="chip" data-word="${esc(s)}">${esc(s)}</button>`).join("");
  let html = `<div class="entry"><div class="headword"><h2>${esc(entry.word)}</h2>`;
  if (entry.phon) html += `<span class="phon">${esc(entry.phon)}</span>`;
  if (entry.audio) html += `<button class="audio" id="playAudio" aria-label="Play pronunciation">▶</button>`;
  html += `</div>${listNote}`;
  for (const [pos, slot] of entry.byPos) {
    html += `<div class="pos">${esc(pos)}</div><ol class="defs">`;
    html += slot.defs.map(d => `<li>${esc(d.text)}${d.ex ? `<span class="ex">“${esc(d.ex)}”</span>` : ""}</li>`).join("");
    html += `</ol>`;
    if (slot.syn.size) html += `<div class="nyms">Similar<div class="chips">${nymChips(slot.syn)}</div></div>`;
    if (slot.ant.size) html += `<div class="nyms">Opposite<div class="chips">${nymChips(slot.ant)}</div></div>`;
  }
  if (entry.sources.length) html += `<p class="source">${entry.credit}: ${entry.sources.map(s => `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(decodeURIComponent(s.replace(/^https?:\/\//, "")))}</a>`).join(", ")}</p>`;
  html += `</div>`;
  out.innerHTML = html;
  if (entry.audio) $("playAudio").addEventListener("click", () => {
    const a = new Audio(entry.audio.startsWith("//") ? "https:" + entry.audio : entry.audio);
    a.play().catch(() => {});
  });
}
$("defineBtn").addEventListener("click", () => define($("defineInput").value));
$("defineInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); define($("defineInput").value); } });

/* ---------- UNSCRAMBLE ---------- */
function parseLetters(s){
  s = s.toLowerCase().replace(/\*/g, "?");
  const letters = s.replace(/[^a-z]/g, "");
  const blanks = Math.min(3, (s.match(/\?/g) || []).length);
  return { letters, blanks };
}
function tilesHTML(letters, blanks){
  return [...letters].map(c => `<span class="tile">${c}</span>`).join("") + `<span class="tile blank">?</span>`.repeat(blanks);
}
$("unInput").addEventListener("input", () => {
  const { letters, blanks } = parseLetters($("unInput").value);
  $("unPreview").innerHTML = tilesHTML(letters, blanks);
});
async function unscramble(){
  const { letters, blanks } = parseLetters($("unInput").value);
  const out = $("unOut");
  if (letters.length + blanks < 2) { out.innerHTML = `<p class="status">Enter at least 2 letters.</p>`; return; }
  if (!WORDS) {
    out.innerHTML = `<p class="status">Loading the word list (about 4 MB, first time only)…</p>`;
    try { await loadLists(); }
    catch { out.innerHTML = `<p class="status err">Couldn't download the word list. Check your connection and tap Unscramble again.</p>`; return; }
  }
  let results = solve(letters, blanks, +$("minLen").value);
  if ($("commonOnly").checked) results = results.filter(r => r.rank !== Infinity);
  renderGroups(out, results, letters.length + blanks);
}
$("unBtn").addEventListener("click", unscramble);
$("unInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); unscramble(); } });
$("minLen").addEventListener("change", () => { if ($("unOut").innerHTML) unscramble(); });
$("commonOnly").addEventListener("change", () => { if ($("unOut").innerHTML) unscramble(); });

/* ---------- COUNTDOWN ---------- */
const VOWEL_POOL = { a:15, e:21, i:13, o:13, u:5 };
const CONS_POOL  = { b:2,c:3,d:6,f:2,g:3,h:2,j:1,k:1,l:5,m:4,n:8,p:4,q:1,r:9,s:9,t:9,v:1,w:1,x:1,y:1,z:1 };
const ROUND_SECS = 30;
let vDeck, cDeck, board, timer = null, timeLeft = 0;

function makeDeck(pool){
  const deck = [];
  for (const [ch, n] of Object.entries(pool)) for (let i = 0; i < n; i++) deck.push(ch);
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  return deck;
}
const isVowel = c => "aeiou".includes(c);

function newRound(){
  clearInterval(timer); timer = null;
  vDeck = makeDeck(VOWEL_POOL); cDeck = makeDeck(CONS_POOL); board = [];
  $("cdPlay").hidden = true; $("cdOut").innerHTML = ""; $("cdVerdict").textContent = ""; $("cdInput").value = "";
  $("cdBar").style.width = "0"; $("cdTime").textContent = "";
  renderBoard();
}
function renderBoard(){
  let html = "";
  for (let i = 0; i < 9; i++) html += board[i] ? `<span class="tile">${board[i]}</span>` : `<span class="tile empty"></span>`;
  $("cdTiles").innerHTML = html;
  const v = board.filter(isVowel).length, c = board.length - v;
  const full = board.length === 9;
  $("vowelBtn").disabled = full || v >= 5;
  $("consBtn").disabled = full || c >= 6;
  $("randomBtn").disabled = board.length > 0;
  $("cdCounts").textContent = full ? `${v} vowels, ${c} consonants` : `${board.length} of 9 picked`;
}
function pick(vowel){
  if (board.length >= 9) return;
  board.push(vowel ? vDeck.pop() : cDeck.pop());
  renderBoard();
  if (board.length === 9) startClock();
}
function randomNine(){
  const vowels = 3 + Math.floor(Math.random() * 3); // 3–5 vowels
  const order = [...Array(vowels).fill(true), ...Array(9 - vowels).fill(false)].sort(() => Math.random() - .5);
  order.forEach(v => board.push(v ? vDeck.pop() : cDeck.pop()));
  renderBoard(); startClock();
}
function startClock(){
  $("cdPlay").hidden = false;
  timeLeft = ROUND_SECS;
  $("cdTime").textContent = timeLeft + "s";
  $("cdBar").style.width = "0";
  requestAnimationFrame(() => $("cdBar").style.width = "0%");
  timer = setInterval(() => {
    timeLeft--;
    $("cdBar").style.width = ((ROUND_SECS - timeLeft) / ROUND_SECS * 100) + "%";
    $("cdTime").textContent = timeLeft > 0 ? timeLeft + "s" : "Time's up";
    if (timeLeft <= 0) { clearInterval(timer); timer = null; }
  }, 1000);
  $("cdInput").focus({ preventScroll: true });
}
async function checkWord(){
  const w = $("cdInput").value.trim().toLowerCase();
  const v = $("cdVerdict");
  if (!w) return;
  const avail = {}; board.forEach(c => avail[c] = (avail[c] || 0) + 1);
  for (const c of w) {
    if (!avail[c]) { v.className = "verdict no"; v.textContent = `“${w}” can't be made from these letters.`; return; }
    avail[c]--;
  }
  try { await loadLists(); } catch { v.className = "verdict no"; v.textContent = "Couldn't load the word list to check it."; return; }
  if (WORDSET.has(w)) {
    const pts = w.length === 9 ? 18 : w.length;
    v.className = "verdict ok"; v.textContent = `“${w}” is valid: ${pts} point${pts === 1 ? "" : "s"}.`;
  } else {
    v.className = "verdict no"; v.textContent = `“${w}” isn't in the word list.`;
  }
}
async function reveal(){
  clearInterval(timer); timer = null; $("cdTime").textContent = "";
  const out = $("cdOut");
  out.innerHTML = `<p class="status">Finding the best words…</p>`;
  try { await loadLists(); } catch { out.innerHTML = `<p class="status err">Couldn't download the word list. Check your connection and try again.</p>`; return; }
  renderGroups(out, solve(board.join(""), 0, 4), 9, { cap: 40, maxGroups: 3 });
}
$("vowelBtn").addEventListener("click", () => pick(true));
$("consBtn").addEventListener("click", () => pick(false));
$("randomBtn").addEventListener("click", randomNine);
$("newBtn").addEventListener("click", newRound);
$("cdCheck").addEventListener("click", checkWord);
$("cdInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkWord(); } });
$("revealBtn").addEventListener("click", reveal);

/* ---------- start ---------- */
renderRecent();
newRound();
showTab(store.get("bd-tab", "define"));
})();
</script>
